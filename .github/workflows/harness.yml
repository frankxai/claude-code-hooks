name: harness

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  hooks-tests:
    name: Hook guardrail behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify python3 available (hooks depend on it)
        run: python3 --version

      - name: Run hook guardrail test harness
        run: bash test/run-hooks-tests.sh
